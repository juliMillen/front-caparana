<div class="container my-5">
  <h1 class="text-danger fw-bold mb-5 text-center">Disciplinas y Actividades</h1>

  <div class="mb-5 pb-4 border-bottom" *ngFor="let category of getCategories()">
    <h2 class="text-danger fw-bold mb-4 text-uppercase fs-3 text-center">{{ category }}</h2>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 justify-content-center">

      <div class="col" *ngFor="let discipline of getDisciplinesByCategory(category)">
        <div class="card h-100 shadow-sm border-0 text-center">
          <div class="card-body pt-0">
            <h5 class="card-title fw-bold mb-1">{{ discipline.description }}</h5>
            <p class="card-text text-muted small mb-0">
              {{ discipline.schedule | slice:0:5 }} hs
            </p>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
