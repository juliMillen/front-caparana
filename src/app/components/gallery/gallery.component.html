<div class="container my-5 my-gallery">

  <div *ngIf="galleries.length === 0" class="text-center py-5">
    <h4 class="text-muted">No hay galerías disponibles</h4>
    <p class="text-secondary">Las galerías aparecerán aquí cuando sean cargadas.</p>
  </div>

  <div *ngFor="let gallery of galleries" class="mb-5">

    <div class="text-center mb-4">
      <h2 class="fw-bold">{{ gallery.title }}</h2>
      <p class="text-muted">{{ gallery.publicationDate }}</p>
    </div>

    <div *ngIf="gallery.photosDTO.length === 0" class="text-center py-3">
      <p class="text-secondary">No hay fotos en esta galería.</p>
    </div>

    <div class="row g-3" *ngIf="gallery.photosDTO.length > 0">
      <div class="col-lg-4 col-md-6 col-12" *ngFor="let photo of gallery.photosDTO">
        <div class="card shadow-sm h-100">
          <img [src]="photo.urlImage" [alt]="photo.description" class="card-img-top img-grid-fixed">
          <div class="card-body">
            <p class="card-text text-center">{{ photo.description }}</p>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
