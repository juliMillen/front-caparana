<div class="container my-5 my-gallery">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10 col-12">
      
      <div id="carouselGaleriaClub" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel">
        
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselGaleriaClub" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carouselGaleriaClub" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carouselGaleriaClub" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>

        <div class="carousel-inner">
          
          <div class="carousel-item active">
            <img src="images/foto1-prueba.jpg" class="d-block w-100 img-carousel-fixed" alt="Equipo Parana">
          </div>
          
          <div class="carousel-item">
            <img src="images/foto2-prueba.jpg" class="d-block w-100 img-carousel-fixed" alt="Equipo Parana 2">
          </div>
          
          <div class="carousel-item">
            <img src="images/foto3-prueba.jpg" class="d-block w-100 img-carousel-fixed" alt="Equipo Parana 3">
          </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselGaleriaClub" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselGaleriaClub" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Siguiente</span>
        </button>

      </div>

    </div>
  </div>
</div>
