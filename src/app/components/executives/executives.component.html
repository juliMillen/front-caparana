<!-- Contenedor centrado y con un ancho máximo controlado -->
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">

    <div class="text-center mb-5" *ngFor="let executive of executives">
      <h2 class="text-danger fw-bold fs-4 mb-3">
        {{ executive.position }}
      </h2>

      <div class="card shadow-sm border-0 bg-light">
        <div class="row g-0 align-items-center p-3">
          <!--<div class="col-4 col-sm-3 text-center">
            <img
              *ngIf="executive.urlImage"
              [src]="executive.urlImage"
              [alt]="executive.name + ' ' + executive.surname"
              class="img-fluid rounded-circle"
            />
          </div>-->

          <div class="col-8 col-sm-9 text-start ps-3">
            <h5 class="card-title fw-bold mb-1 text-center" >
              {{ executive.name }} {{ executive.surname }}
            </h5>
            <p class="card-text text-muted small mb-0 text-center">
              Gestión Actual
            </p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
