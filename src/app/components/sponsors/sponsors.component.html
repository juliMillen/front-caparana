<div class="container text-center my-5">

  <h3 class="mb-4 text-muted text-uppercase sponsors-title">
    Sponsors
  </h3>

  <div class="row align-items-center justify-content-center g-4">

    <div
      class="col-6 col-md-3"
      *ngFor="let sponsor of sponsors"
    >

      <div class="sponsor-card">

        <img
          [src]="sponsor.urlImage || 'assets/img/placeholder-sponsor.jpg'"
          [alt]="'Logo de ' + sponsor.name"
          class="img-fluid sponsor-image"
        >

      </div>

    </div>

  </div>

  <div
    *ngIf="sponsors.length === 0"
    class="py-4"
  >
    <p class="text-muted mb-0">
      No hay sponsors disponibles.
    </p>
  </div>

</div>
