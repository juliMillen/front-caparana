<!-- MODAL -->
<div class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Categoria</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="categorityForm" novalidate (ngSubmit)="createCategority()">

          <!--NAME-->
          <div class="mb-3">
            <label class="form-label">Nombre Categoria: </label>
            <input type="text" class="form-control" formControlName="nameCategority" name="nameCategority" [ngClass]="{
              'is-invalid': categorityForm.get('nameCategority')?.invalid && categorityForm.get('nameCategority')?.touched,
              'is-valid': categorityForm.get('nameCategority')?.valid && categorityForm.get('nameCategority')?.touched
            }">

            <div class="invalid-feedback" *ngIf="categorityForm.get('nameCategority')?.errors?.['required']">
              El nombre es obligatorio
            </div>
          </div>
          <!--VISTA DE JUGADORES AGREGADOS-->

          <div class="mb-3" *ngIf="players.length > 0">
            <label class="form-label fw-bold">
              Jugadores Agregados:
            </label>

            <div *ngFor="let player of players" class="border rounded p-2 mb-2">
              <strong>{{player.name}} {{player.surname}}</strong>
              <br>
              <small>
                {{player.position}} - {{player.num}}
              </small>
            </div>
          </div>

           <!--VISTA DE STAFF AGREGADO-->

          <div class="mb-3" *ngIf="staff.length > 0">
            <label class="form-label fw-bold">
              Empleados Tecnicos Agregados:
            </label>

            <div *ngFor="let s of staff" class="border rounded p-2 mb-2">
              <strong>{{s.name}} {{s.surname}}</strong>
              <br>
              <small>
                {{s.position}}
              </small>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" (click)="closeModal()">Cancelar</button>
            <button *ngIf="!createdCategority" type="button" class="btn btn-success"
            (click)="createCategority()">Guardar</button>
            <button type="button" class="btn btn-danger" (click)="openPlayerModal()" [disabled]="!createdCategority">Agregar Jugador</button>
            <button type="button" class="btn btn-danger" (click)="openStaffModal()" [disabled]="!createdCategority">Agregar Empleado Tecnico</button>
            <button type="button" class="btn btn-danger" (click)="finish()">Finalizar</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<app-player-form *ngIf="showPlayerModal" 
(playerCreated)="createPlayer($event)" 
(closedModal)="closePlayerModal()">
</app-player-form>

<app-staff-form *ngIf="showStaffModal"
(staffCreated)="createStaff($event)"
(closedModal)="closeStaffModal()"
>
</app-staff-form>
