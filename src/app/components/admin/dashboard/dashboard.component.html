<div class="container my-5">

  <h1 class="text-danger fw-bold mb-2">Panel de Administración</h1>
  <p class="text-muted mb-4">Elegí una sección para gestionar su contenido.</p>

  <div class="row g-4">
    <div class="col-12 col-sm-6 col-lg-4" *ngFor="let section of sections">

      <div
        class="card h-100 shadow-sm dashboard-card"
        role="button"
        [routerLink]="section.route"
       >

        <div class="card-body d-flex flex-column align-items-start">
          <i class="bi {{ section.icon }} fs-1 text-danger mb-3"></i>
          <h5 class="card-title fw-bold">{{ section.title }}</h5>
          <p class="card-text text-muted">{{ section.description }}</p>
        </div>

      </div>

    </div>
  </div>

</div>
