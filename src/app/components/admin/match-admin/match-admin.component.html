<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-danger fw-bold">Administrar Partidos</h1>

        <button class="btn btn-primary" (click)="openModal()">Agregar</button>

        <!--Buscar por ID-->
        <div class="input-group mb-4" style="max-width: 400px;">
            <input type="number" class="form-control"
            placeholder="Buscar partido por ID"
            [(ngModel)]="searchId"
            (keyup.enter)="getMatchById()">
            <button class="btn-btn danger" type="button" (click)="getMatchById()">Buscar</button>
            <button class="btn btn-outline-secondary" type="button" (click)="clearSearch()">Limpiar</button>
        </div>

    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-danger">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Rival</th>
                    <th scope="col">Fecha y Hora</th>
                    <th scope="col">Lugar</th>
                    <th scope="col">Goles del equipo</th>
                    <th scope="col">Goles del rival</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-center">Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let m of filteredMatches">
                    <td>{{m.idMatch}}</td>
                    <td>{{m.rival}}</td>
                    <td>{{m.dateTime}}</td>
                    <td>{{m.location}}</td>
                    <td>{{m.teamGoals}}</td>
                    <td>{{m.rivalGoals}}</td>
                    <td>{{getStateLabel(m.state)}}</td>
                    <td class="text-center">
                        <button class="btn btn-outline-success" (click)="openEditModal(m)">Editar</button>
                        <button class="btn btn-outline-danger btn-sm" (click)="deleteMatch(m.idMatch)">Eliminar</button>
                    </td>
                </tr>

                <tr *ngIf="filteredMatches.length === 0">
                    <td colspan="8" class="text-center text-muted py-4">No se encontraron partidos</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<app-match-form
*ngIf="showModal"
[match]="selectedMatch"
(matchCreated)="createMatch($event)"
(matchUpdated)="updateMatch($event)"
(closedModal)="closeModal()"
>
</app-match-form>
