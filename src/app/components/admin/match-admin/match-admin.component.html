<div class="container my-5">
        <!-- Título y botón agregar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-danger fw-bold mb-0">Administrar Partidos</h1>
        <button class="btn btn-primary" (click)="openModal()">Agregar</button>
    </div>

    <!-- Buscador -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <label for="searchId" class="form-label fw-semibold">
                Buscar por ID
            </label>

            <div class="input-group">
                <input
                    type="number"
                    id="searchId"
                    class="form-control"
                    placeholder="Ingrese el ID del partido"
                    [(ngModel)]="searchId"
                    (keyup.enter)="getMatchById()">

                <button class="btn btn-primary" type="button" (click)="getMatchById()">
                    Buscar
                </button>
                <button class="btn btn-outline-secondary" type="button" (click)="clearSearch()">
                    Limpiar
                </button>
            </div>
        </div>

    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-danger">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Rival</th>
                    <th scope="col">Fecha y Hora</th>
                    <th scope="col">Lugar</th>
                    <th scope="col">Goles del equipo</th>
                    <th scope="col">Goles del rival</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-center">Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let m of filteredMatches">
                    <td>{{m.idMatch}}</td>
                    <td>{{m.rival}}</td>
                    <td>{{m.dateTime}}</td>
                    <td>{{m.location}}</td>
                    <td>{{m.teamGoals}}</td>
                    <td>{{m.rivalGoals}}</td>
                    <td>{{getStateLabel(m.state)}}</td>
                    <td class="d-flex justify-content-center gap-2">
                        <button class="btn btn-sm btn-outline-danger action-btn" (click)="openEditModal(m)"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-danger action-btn" (click)="deleteMatch(m.idMatch)"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>

                <tr *ngIf="filteredMatches.length === 0">
                    <td colspan="8" class="text-center text-muted py-4">No se encontraron partidos</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<app-match-form
*ngIf="showModal"
[match]="selectedMatch"
(matchCreated)="createMatch($event)"
(matchUpdated)="updateMatch($event)"
(closedModal)="closeModal()"
>
</app-match-form>
